buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Dgeckolib.disable_examples=true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file(project.findProperty('csj.clientRunDir') ?: 'run-client')
            def clientUsername = project.findProperty('csj.clientUsername')
            if (clientUsername) {
                args '--username', clientUsername.toString()
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs "-Dcsj.armorTintDebug=true"
        }

        server {
            workingDirectory project.file(project.findProperty('csj.serverRunDir') ?: 'run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            def gameTestRunDirectory = project.file(project.findProperty('csj.gameTestRunDir') ?: 'run-gametest')
            workingDirectory gameTestRunDirectory
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.findProperty('csj.performanceJfr')?.toString()?.toBoolean()) {
                def recordingPath = new File(gameTestRunDirectory, 'csj-gametest.jfr')
                        .absolutePath.replace('\\', '/')
                jvmArgs "-XX:StartFlightRecording=filename=${recordingPath},settings=profile,dumponexit=true"
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--input', file('src/main/snbt/')
        }
    }
}

// Include generated game resources, but never package Datagen's incremental cache.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('testKungFuConfigMigration', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free kung fu config migration regression checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shengchanshe.chang_sheng_jue.martial_arts.kungfu.KungFuConfigMigrationTest'
}

// These regression checks use a dependency-free main entry instead of a Test framework.
tasks.named('test').configure {
    enabled = false
}

def dedicatedRegressionSources = files(
        'src/test/java/com/shengchanshe/chang_sheng_jue/martial_arts/kungfu/KungFuConfigMigrationTest.java',
        'src/test/java/com/shengchanshe/chang_sheng_jue/martial_arts/kungfu/KungFuConfigOriginProbeTest.java'
)

tasks.register('verifyNoUnconfiguredTests') {
    group = 'verification'
    description = 'Fails when a test source is not wired to a verification task.'
    inputs.files(fileTree('src/test/java') { include '**/*.java' })

    doLast {
        def unconfiguredSources = fileTree('src/test/java') {
            include '**/*.java'
        }.files - dedicatedRegressionSources.files
        if (!unconfiguredSources.isEmpty()) {
            def paths = unconfiguredSources.collect { project.relativePath(it) }.sort().join(', ')
            throw new GradleException("Unconfigured test sources: ${paths}. Configure a test framework or a dedicated verification task.")
        }
    }
}

tasks.named('test').configure {
    dependsOn tasks.named('testKungFuConfigMigration')
    dependsOn tasks.named('verifyNoUnconfiguredTests')
}

tasks.named('check').configure {
    dependsOn tasks.named('testKungFuConfigMigration')
    dependsOn tasks.named('verifyNoUnconfiguredTests')
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}

mixin{
    add sourceSets.main , "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    debug.export = true
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url 'https://maven.blamejared.com'
    }
    maven {
        url "https://cursemaven.com"
    }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
     flatDir {
         dir 'libs'
     }
}

def runtimeDependencyEnabled = { String propertyName ->
    def value = providers.gradleProperty(propertyName).getOrElse('true').trim().toLowerCase(Locale.ROOT)
    if (value != 'true' && value != 'false') {
        throw new GradleException("${propertyName} must be true or false, but was '${value}'.")
    }
    value.toBoolean()
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.3')

    compileOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}")
    if (runtimeDependencyEnabled('csj.includeTerraBlender')) {
        runtimeOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}")
    }

    compileOnly fg.deobf("curse.maven:arsenal_core-506064:6556122")
    if (runtimeDependencyEnabled('csj.includeArsenal')) {
        runtimeOnly fg.deobf("curse.maven:arsenal_core-506064:6556122")
    }

    compileOnly fg.deobf("curse.maven:epic-fight-405076:6145747")
    if (runtimeDependencyEnabled('csj.includeEpicFight')) {
        runtimeOnly fg.deobf("curse.maven:epic-fight-405076:6145747")
    }
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    if (runtimeDependencyEnabled('csj.includeJei')) {
        runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84.1-FORGE:api")
    if (runtimeDependencyEnabled('csj.includePatchouli')) {
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84.1-FORGE")
    }
    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    def localConvenienceMods = [
            "blank:Neat-${minecraft_version}:41",
            "blank:dummmmmmy-${minecraft_version}:2.0.6",
            "blank:moonlight-${minecraft_version}:2.16.16",
            "blank:Jade-${minecraft_version}:11.13.1",
            "blank:constructionwand-${minecraft_version}:2.11",
            "blank:appleskin-${minecraft_version}:2.5.1",
            "blank:Xaeros_Minimap-${minecraft_version}:25.2.10",
            "blank:amendments-${minecraft_version}:2.2.3"
    ]
    localConvenienceMods.each { dependencyNotation ->
        compileOnly fg.deobf(dependencyNotation)
        testCompileOnly fg.deobf(dependencyNotation)
        if (runtimeDependencyEnabled('csj.includeLocalConvenienceMods')) {
            runtimeOnly fg.deobf(dependencyNotation)
        }
    }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            terrablender_version_range: terrablender_version_range,
            geckolib_version_range: geckolib_version_range,
            arsenal_core_version_range: arsenal_core_version_range,
            epic_fight_version_range: epic_fight_version_range,
            jei_version_range: jei_version_range,
            patchouli_version_range: patchouli_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }

    from('LICENSE.txt') {
        into 'META-INF'
        rename { "${mod_id}-LICENSE.txt" }
    }

    // GameTests run from the development classpath and are not part of the release runtime.
    exclude '**/*GameTests.class', '**/*GameTests$*.class'

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks required release metadata and rejects packaged GameTest classes.'
    dependsOn 'jar'
    dependsOn 'reobfJar'
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })

    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR not found: ${archive}")
        }

        def zip = new java.util.zip.ZipFile(archive)
        try {
            def entryNames = [] as Set
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                entryNames.add(entries.nextElement().name)
            }

            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer.cfg',
                    mod_id.toString() + '.mixins.json'
            ]
            def missingEntries = requiredEntries.findAll { !entryNames.contains(it) }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR ${archive.absolutePath} is missing required entries: ${missingEntries.join(', ')}")
            }

            def packagedGameTests = entryNames.findAll {
                it.endsWith('.class') && (it.contains('GameTests.class') || it.contains('GameTests$'))
            }.sort()
            if (!packagedGameTests.isEmpty()) {
                throw new GradleException("GameTest classes must not be packaged: ${packagedGameTests.join(', ')}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the release build, dedicated migration regression, GameTest server, and JAR checks.'
    dependsOn 'build'
    dependsOn 'testKungFuConfigMigration'
    dependsOn 'runGameTestServer'
    dependsOn 'verifyReleaseJar'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    mustRunAfter 'build'
    mustRunAfter 'testKungFuConfigMigration'
}

tasks.matching { it.name == 'reobfJar' }.configureEach {
    mustRunAfter 'jar'
}

tasks.named('verifyReleaseJar').configure {
    mustRunAfter 'reobfJar'
    mustRunAfter 'runGameTestServer'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
